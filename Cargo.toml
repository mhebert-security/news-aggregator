[package]
name = "news-aggregator"
version = "0.1.0"
edition = "2024"

# The dependency list mirrors the news half of zero-trust-server, which these
# files came from. quick-xml parses the RSS and Atom feeds. rusqlite (bundled)
# compiles the SQLite amalgamation at build time, so the fetcher needs no
# system SQLite package. rustls opens the verified TLS connections, and
# prefer-post-quantum pins the aws-lc-rs provider (a rustls default today,
# declared here so a future default change cannot silently drop the
# X25519MLKEM768 hybrid key exchange). webpki-roots supplies the Mozilla root
# set the fetcher verifies those connections against. Everything else is std.
[dependencies]
quick-xml = { version = "0.42.0", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", features = ["prefer-post-quantum"] }
webpki-roots = "1.0.9"

[profile.release]
opt-level = "z"    # optimize for binary size
lto = true         # link-time optimization
panic = "abort"    # smaller binary, no unwinding overhead
strip = true       # strip debug symbols from release binary
